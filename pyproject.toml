[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "diverse-sampling-flows"
version = "0.1.0"
description = "Gaussian-preserving prior flows for diverse text-to-image generation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate==1.10.1",
  "diffusers==0.35.1",
  "huggingface-hub==0.34.4",
  "matplotlib==3.10.6",
  "numpy==2.2.6",
  "omegaconf==2.3.0",
  "pandas==2.3.2",
  "pillow==11.3.0",
  "protobuf==6.32.0",
  "safetensors==0.6.2",
  "scikit-learn==1.7.1",
  "scipy==1.16.1",
  "sentencepiece==0.2.1",
  "tensorboard==2.20.0",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "transformers==4.56.0",
]

[project.optional-dependencies]
dev = ["build==1.3.0", "pytest==8.4.1", "ruff==0.12.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/diverse_sampling_flows"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

